name: build

# 只跑不需要签名与手环 SDK 的部分：:core:domain 的 JVM 测试。
# :app 的编译与 lint 依赖 app/libs/xms-wearable-lib_1.4_release.aar，该文件被 .gitignore 排除
# （见 app/libs/README.md），因此公开仓库的 CI 无法编译 :app。AAR 存在时才跑 lint。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  domain-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Domain tests
        run: ./gradlew :core:domain:test --configure-on-demand --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-report
          path: core/domain/build/reports/tests/test

  lint:
    runs-on: ubuntu-latest
    needs: domain-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check wearable SDK presence
        id: aar
        run: |
          if [ -f app/libs/xms-wearable-lib_1.4_release.aar ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未找到 xms-wearable-lib_1.4_release.aar，跳过 lint。取得方式见 app/libs/README.md。"
          fi

      - name: Set up Android SDK
        if: steps.aar.outputs.present == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Lint
        if: steps.aar.outputs.present == 'true'
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Upload lint report
        if: always() && steps.aar.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
