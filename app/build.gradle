plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 原版升级使用本地私有配置；源码包不包含签名密码或密钥。
def originalSigningFile = rootProject.file('signing.properties')
def originalSigning = new Properties()
if (originalSigningFile.exists()) {
    originalSigningFile.withInputStream { originalSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (!originalSigning.getProperty(name)) throw new GradleException("signing.properties 缺少 ${name}")
    }
    def keyStore = java.security.KeyStore.getInstance('JKS')
    rootProject.file(originalSigning.storeFile).withInputStream {
        keyStore.load(it, originalSigning.storePassword.toCharArray())
    }
    if (!keyStore.isKeyEntry(originalSigning.keyAlias)) throw new GradleException('原版签名配置不包含私钥')
    def fingerprint = java.security.MessageDigest.getInstance('SHA-256')
        .digest(keyStore.getCertificate(originalSigning.keyAlias).encoded).encodeHex().toString()
    if (fingerprint != '2787e9a025cbd6606ac2ec05415432513ada6732360ce4dc2abb22e049e938bf') {
        throw new GradleException('签名证书与原版 0.2.5 不同，不能用于覆盖升级')
    }
}

android {
    namespace 'app.van.timetable'
    compileSdk 37
    defaultConfig {
        applicationId 'app.van.timetable'
        minSdk 26
        targetSdk 37
        versionCode 70
        versionName '0.5.20'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (originalSigningFile.exists()) {
        signingConfigs {
            original {
                storeFile rootProject.file(originalSigning.storeFile)
                storePassword originalSigning.storePassword
                keyAlias originalSigning.keyAlias
                keyPassword originalSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug { if (originalSigningFile.exists()) signingConfig signingConfigs.original }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Phone delivery defaults to arm64. Debug retains emulator/older-device support.
            // Example: -PvanReleaseAbis=armeabi-v7a,arm64-v8a,x86,x86_64
            ndk {
                abiFilters.addAll(providers.gradleProperty('vanReleaseAbis')
                    .getOrElse('arm64-v8a').split(',').collect { it.trim() })
            }
            if (originalSigningFile.exists()) signingConfig signingConfigs.original
        }
    }
    packaging {
        // Compress DEX in the download; Android extracts/optimizes it at installation.
        dex { useLegacyPackaging true }
    }
}

// 只在真的要出 release 包时检查前置条件，debug 构建与 :core:domain 测试不受影响。
// 缺 AAR 是硬编译错误、缺签名会静默产出未签名包，两者都让失败原因指向文档而不是一堆符号缺失。
def wearableAar = file('libs/xms-wearable-lib_1.4_release.aar')
def allowUnsignedRelease = providers.gradleProperty('vanAllowUnsignedRelease').getOrElse('false').toBoolean()
def unsignedReleaseMissing = !originalSigningFile.exists()
def modulePath = project.path

gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { task ->
        task.project.path == modulePath &&
            (task.name.startsWith('assembleRelease') || task.name.startsWith('bundleRelease'))
    }
    if (!buildsRelease) { return }
    if (!wearableAar.exists()) {
        throw new GradleException(
            "缺少 app/libs/${wearableAar.name}。该 AAR 不随源码分发，取得方式与校验值见 app/libs/README.md。")
    }
    if (unsignedReleaseMissing && !allowUnsignedRelease) {
        throw new GradleException(
            '缺少 signing.properties，release 包会没有签名，覆盖升级会因此断掉。' +
            '请恢复 signing.properties 与密钥；确实要打未签名包请显式用 -PvanAllowUnsignedRelease=true。')
    }
}

dependencies {
    implementation files('libs/xms-wearable-lib_1.4_release.aar')
    implementation project(':core:data')
    implementation project(':softglass')
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.core.ktx
    implementation libs.androidx.exifinterface
    implementation libs.androidx.webkit
    implementation libs.kotlinx.serialization.json
    implementation libs.kotlinx.coroutines.android
    implementation libs.jxl
    implementation libs.tesseract4android
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.uiautomator
}
